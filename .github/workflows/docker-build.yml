name: Docker Image CI/CD

# Ye workflow tab chalega jab tu 'main' branch pe code push karega
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Check out the repo
      uses: actions/checkout@v4

    # Ye step tere Docker Hub account me login karega
    - name: 🔑 Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: ⚙️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Ye step GitHub pe ek temporary .env.local banayega jisse Next.js build ho sake
    - name: 📝 Create .env.local for Next.js build
      run: |
        echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
        echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local

    # Ye actual build aur push ka command hai
    - name: 🚀 Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        # SMART LOGIC: Agar Pull Request hai, toh sirf build karo (test karo). 
        # Jab code merge ho jaye ('push'), tabhi Docker Hub par upload karo.
        push: ${{ github.event_name != 'pull_request' }}
        tags: aafaquenazir75/inv-mgm-app:latest 
        # Caching on Github Actions to make future builds faster
        cache-from: type=registry,ref=aafaquenazir75/inv-mgm-app:buildcache
        cache-to: type=registry,ref=aafaquenazir75/inv-mgm-app:buildcache,mode=max

  # Iske baad ek step aur hota hai (deploy-to-server) jisme Github tere server me 
  # login (via SSH) karke bolta hai: 'docker compose pull && docker compose up -d'
