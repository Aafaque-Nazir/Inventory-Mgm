name: Docker Image CI/CD

# Ye workflow tab chalega jab tu 'main' branch pe code push karega
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Check out the repo
      uses: actions/checkout@v4

    # Ye step tere Docker Hub account me login karega
    - name: 🔑 Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: ⚙️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Ye actual build aur push ka command hai
    - name: 🚀 Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # Yahan apna Dockerhub username change kar lena (e.g. username/inv-mgm-app:latest)
        tags: aafaquenazir75/inv-mgm-app:latest 
        # Caching on Github Actions to make future builds faster
        cache-from: type=registry,ref=aafaquenazir75/inv-mgm-app:buildcache
        cache-to: type=registry,ref=aafaquenazir75/inv-mgm-app:buildcache,mode=max

  # Iske baad ek step aur hota hai (deploy-to-server) jisme Github tere server me 
  # login (via SSH) karke bolta hai: 'docker compose pull && docker compose up -d'
