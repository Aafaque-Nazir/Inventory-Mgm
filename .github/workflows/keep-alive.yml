name: Keep Supabase Alive

on:
  schedule:
    # Run at 00:00 UTC every 2 days to be safe (Supabase pauses after ~7 days of inactivity)
    - cron: "0 0 */2 * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          # Use -L to follow redirects, and a real User-Agent
          curl -L -v \
            -A "GitHub-Action-KeepAlive/1.0" \
            https://nvntory-mgm.vercel.app/api/keep-alive
