name: Keep Supabase Alive

on:
  schedule:
    # Run daily at 06:00 UTC — Supabase pauses after ~7 days of inactivity.
    # Daily is safest: if one run fails, you still have 6 retries before pause.
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual triggering from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Validate secrets are configured
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing required secrets. Add SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in GitHub repo Settings → Secrets."
            exit 1
          fi

          echo "Pinging Supabase at $(date -u '+%Y-%m-%d %H:%M:%S UTC')..."

          # Query the profiles table via Supabase PostgREST API directly.
          # Using service_role key bypasses RLS — guarantees the query reaches the DB.
          # ?limit=1 keeps it lightweight.
          HTTP_STATUS=$(curl -s -o /tmp/supabase_response.json -w "%{http_code}" \
            -X GET \
            "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --connect-timeout 30 \
            --max-time 60)

          RESPONSE_BODY=$(cat /tmp/supabase_response.json)

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase is alive! HTTP $HTTP_STATUS"
            echo "Response: $RESPONSE_BODY"
          else
            echo "::warning::Supabase returned HTTP $HTTP_STATUS — database may be waking up."
            echo "Response: $RESPONSE_BODY"

            # Retry once after 30 seconds (Supabase may need time to unpause)
            echo "Retrying in 30 seconds..."
            sleep 30

            RETRY_STATUS=$(curl -s -o /tmp/supabase_retry.json -w "%{http_code}" \
              -X GET \
              "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              --connect-timeout 30 \
              --max-time 60)

            if [ "$RETRY_STATUS" -ge 200 ] && [ "$RETRY_STATUS" -lt 300 ]; then
              echo "✅ Retry succeeded! HTTP $RETRY_STATUS"
            else
              echo "::error::Retry also failed with HTTP $RETRY_STATUS"
              cat /tmp/supabase_retry.json
              exit 1
            fi
          fi

      - name: Also ping Vercel app (secondary)
        if: always()
        run: |
          # Secondary ping to keep Vercel's edge cache warm
          curl -sL -o /dev/null -w "Vercel HTTP: %{http_code}\n" \
            -A "GitHub-Action-KeepAlive/2.0" \
            https://nvntory-mgm.vercel.app/api/keep-alive \
            --connect-timeout 15 \
            --max-time 30 || echo "::warning::Vercel ping failed (non-critical)"
